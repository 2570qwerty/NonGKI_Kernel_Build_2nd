name: Build Huawei P20 Lite (EMUI 9.1 / Kirin 659)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME: "huawei_p20_lite"
  DEVICE_CODENAME: "anne"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "OBJCOPY=objcopy LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib64"

  KERNEL_SOURCE: "https://github.com/LineageOS/android_kernel_huawei_hi6250.git"
  KERNEL_BRANCH: "lineage-17.1"

  CLANG_SOURCE: "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH: "lineage-20.0"

  GCC_GNU : false
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "merge_hi6250_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true" # if u want easy setting kernelsu, u can true.
  KERNELSU_AUTO_FORK : "bakasu" # xxksu, rsuntk, next, bakasu and sukisu

  SUSFS_ENABLE : "false"
  SUSFS_FIXED : "false"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT: "emui9_1_a9"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "AnyKernel3" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Huawei P20 Lite (hi6250 / Kirin 659)
    runs-on: ubuntu-22.04 # u can changed to ubuntu 22.04, and need container set ubuntu-24.04
    # container: archlinux/archlinux:latest # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # (1) GCC>=10 defaults to -fno-common -> breaks 4.9 host tools (dtc: multiple definition of yylloc)
          grep -q "HOSTCFLAGS += -fcommon" Makefile || echo "HOSTCFLAGS += -fcommon" >> Makefile
          sed -i "s/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/" scripts/dtc/dtc-lexer.lex.c 2>/dev/null || true
          # (2) vendor drivers force -Werror (with GCC-only flags) through EXTRA_CFLAGS /
          #     subdir-ccflags-y, which lands AFTER KBUILD_CFLAGS and beats any global -Wno-error.
          #     Strip only the standalone token; -Werror=<opt> guards stay intact.
          for f in sound/usb/hifi/Makefile \
                   drivers/connectivity/hisi/platform/Makefile \
                   drivers/connectivity/hisi/wifi/Makefile \
                   drivers/connectivity/hi11xx/hi1102a/platform/Makefile \
                   drivers/connectivity/hi11xx/hi1102a/wifi/Makefile \
                   drivers/connectivity/hi11xx/hi1103/platform/Makefile \
                   drivers/connectivity/hi11xx/hi1103/wifi/1103/Makefile \
                   drivers/cfi/Makefile ; do
            if [ -f "$f" ]; then
              sed -i -E "s/(^|[[:space:]])-Werror([[:space:]]|$)/\1\2/g" "$f" && echo "stripped -Werror: $f"
            fi
          done
          # (2b) tzdriver: crypto_shash_descsize() is a runtime value -> illegal VLA in struct
          sed -i "s/char ctx\[crypto_shash_descsize(g_tee_shash_tfm)\];/char ctx[512];/" \
            drivers/hisi/tzdriver/tc_client_driver.c && echo "patched tzdriver VLA"
          # (2c) KernelSU preinit runner needs nolibc (kernel 5.x+) -> drop those objects
          grep -rl "preinit/blob.o" drivers/kernelsu 2>/dev/null | while read -r f; do
            sed -i "/preinit\/blob.o/d; /preinit\/preinit.o/d" "$f" && echo "dropped ksu preinit: $f"
          done
          # (3) belt and braces: newer clang promotes several pointer-type diagnostics to
          #     hard errors BY DEFAULT, and -Wno-error cannot demote those.
          echo "KCFLAGS=-Wno-unknown-warning-option -Wno-error -w -Wno-everything -Wno-format-security -Wno-format-nonliteral -Wno-format -Wno-incompatible-pointer-types-discards-qualifiers -Wno-incompatible-pointer-types -Wno-incompatible-function-pointer-types -Wno-int-conversion -Wno-tautological-unsigned-enum-zero-compare -Wno-non-literal-null-conversion -Wno-address-of-packed-member -Wno-misleading-indentation -Wno-unused-but-set-variable -Wno-parentheses-equality -Wno-bool-operation -Wno-implicit-function-declaration -Wno-shift-negative-value -Wno-constant-conversion -Wno-implicit-int" >> $GITHUB_ENV

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
